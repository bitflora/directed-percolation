[package]
name = "dpenum"
version = "0.1.0"
edition = "2021"

[features]
u32 = []
u16 = []
# dpwall: u128 keys instead of u64, for n > 121 (8 more bytes per state)
wide = []

[[bin]]
name = "dpenum"
path = "src/main.rs"

[[bin]]
name = "dpwall"
path = "src/wall.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
